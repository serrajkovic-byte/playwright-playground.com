name: Branch policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-branch:
    name: Validate feature branch name
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Require the branch naming convention
        run: |
          if [[ ! "$SOURCE_BRANCH" =~ ^PW_playground_[^/]+$ ]]; then
            echo "Invalid branch name: $SOURCE_BRANCH"
            echo "Use PW_playground_Name, e.g. PW_playground_Ana."
            exit 1
          fi
